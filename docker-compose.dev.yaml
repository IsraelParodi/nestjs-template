services:
  db:
    image: postgres:18.1
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=db_owner
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=db_dev
    volumes:
      - data:/var/lib/postgresql
  testdb:
    image: postgres:18.1
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=db_owner
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=db_testing

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: db_owner
      DATABASE_PASSWORD: 123456
      DATABASE_NAME: db_dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run migration:run && npm run start:dev"

volumes:
  data: