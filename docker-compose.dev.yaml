services:
  db:
    image: postgres:18.1
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      - data:/var/lib/postgresql
  testdb:
    image: postgres:18.1
    restart: always
    ports:
      - "5433:5432"
    env_file:
      - .env.test
    profiles: ["TEST"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.development
    depends_on:
      - db
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
      - ./migrations:/usr/src/app/migrations
    ports:
      - "3000:3000"

volumes:
  data: